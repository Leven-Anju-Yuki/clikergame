<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Administrateur - Lapinous & Boss</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css"/>
    <link rel="stylesheet" href="./css/dashboard.css"/>
</head>
<body class="dashboard-auth-pending" data-protected-dashboard="true">

<div class="container-fluid py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>Dashboard Administration</h1>
        <a href="./index.html" class="btn btn-outline-secondary">Back to Game ➔</a>
    </header>

    <section class="panel mb-4">
        <h2>Statistiques des Lapins & Raretés</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="chart-box">
                    <h3>Répartition par Rareté</h3>
                    <canvas id="chart-rarity"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-box">
                    <h3>Taux de Découverte / Déblocage</h3>
                    <canvas id="chart-discovery"></canvas>
                </div>
            </div>
        </div>
    </section>

    <section class="panel mb-4">
        <h2>Gestion des Lapins</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="table-rabbits">
                <thead>
                    <tr>
                        <th>Nom de base</th>
                        <th>Nom personnalisé</th>
                        <th>Rareté</th>
                        <th>Personnalité</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section class="panel mb-4">
        <h2>Gestion des Boss</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="table-bosses">
                <thead>
                    <tr>
                        <th>Boss</th>
                        <th>Titre</th>
                        <th>PV (HP)</th>
                        <th>Découvert / Vaincu</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./js/dashboard-access.js"></script>
<script src="./js/dashboard.js" type="module"></script>
</body>
</html>
